name: digivla_mobile
description: Digivla IDS mobile app — TV, Radio & Online media operations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: assets/logo/app_icon_foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo/digivla_logo.png
    - assets/logo/app_icon.png
    - assets/logo/app_icon_foreground.png
